services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: la-tasa-api
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - api/.env
    environment:
      PORT: "3001"
      NODE_ENV: production
    volumes:
      # persiste variaciones entre pasadas
      - api-data:/app/api/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/rates').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  api-data:
